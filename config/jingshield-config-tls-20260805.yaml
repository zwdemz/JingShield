server:
  listen: "0.0.0.0:18080"
  admin_listen: "0.0.0.0:18080"
  tls_listen: "0.0.0.0:18443"
  tls_cert_file: "/etc/jingshield/tls/jingshield.crt"
  tls_key_file: "/etc/jingshield/tls/jingshield.key"
  read_timeout: 30
  write_timeout: 30
  max_body_bytes: 10485760
  trusted_proxies: []

upstream:
  target: "http://127.0.0.1:19000"
  timeout: 30
  pass_host: false

database:
  host: "127.0.0.1"
  port: 3306
  user: "jingshield"
  pass: "JingShield@2026_Reset"
  name: "jyj_ccpro"
  charset: "utf8mb4"
  max_open_conns: 50
  max_idle_conns: 10
  conn_max_lifetime: 300

admin_ips:
  - "127.0.0.1"
  - "192.168.118.0/24"

log:
  level: "info"
  dir: "/var/log/jingshield"
  max_size_mb: 100
  max_backups: 10
  max_age_days: 30

data:
  qqwry_dat: "/opt/jingshield/data/QQWry.Dat"
  state_gc_interval: 60

session:
  name: "jingshield_session"
  secret: ""
  max_age: 7200
  domain: ""
  secure: true
  verify_cookie_max_age: 3600
