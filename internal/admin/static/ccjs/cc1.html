<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>安全验证 - 捷云鲸盾</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: "Microsoft YaHei", Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .shield-container {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 16px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
            padding: 40px;
            text-align: center;
            max-width: 500px;
            width: 100%;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        .shield-title {
            font-size: 28px;
            color: #2c3e50;
            margin-bottom: 20px;
            font-weight: 700;
        }
        .shield-desc {
            color: #666;
            margin-bottom: 30px;
            line-height: 1.6;
            font-size: 16px;
        }
        .countdown {
            font-size: 64px;
            font-weight: bold;
            color: #1890ff;
            margin-bottom: 30px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.1);
        }
        .shield-btn {
            display: inline-block;
            padding: 14px 40px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 50px;
            font-size: 18px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
            width: 100%;
        }
        .shield-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(102, 126, 234, 0.6);
        }
        .shield-btn:active {
            transform: translateY(0);
        }
        .shield-btn:disabled {
            background: linear-gradient(135deg, #d9d9d9 0%, #bfbfbf 100%);
            cursor: not-allowed;
            box-shadow: none;
            transform: none;
        }
        
        /* 响应式设计 */
        @media (max-width: 768px) {
            .shield-container {
                padding: 30px 20px;
                margin: 0 15px;
            }
            
            .shield-title {
                font-size: 24px;
            }
            
            .shield-desc {
                font-size: 14px;
                margin-bottom: 25px;
            }
            
            .countdown {
                font-size: 48px;
                margin-bottom: 25px;
            }
            
            .shield-btn {
                padding: 12px 30px;
                font-size: 16px;
            }
        }
        
        @media (max-width: 480px) {
            .shield-container {
                padding: 25px 15px;
            }
            
            .shield-title {
                font-size: 20px;
            }
            
            .countdown {
                font-size: 40px;
            }
        }
    </style>
</head>
<body>
    <div class="shield-container">
        <h2 class="shield-title">安全验证</h2>
        <p class="shield-desc">为了确保网站安全，需要进行安全验证。请稍等5秒后点击验证按钮。</p>
        <div class="countdown" id="countdown">5</div>
        <button class="shield-btn" id="verifyBtn" disabled>验证</button>
    </div>
    
    <script src="safe/ccjs/cc1.js"></script>
</body>
</html>
