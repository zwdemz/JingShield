    <style>
        html, body, h1 {
            margin: 0;

        #demo {

            max-width: 500px;
            margin: 0 auto;
            padding: 30px;
            border: 1px dashed rgba(255, 255, 255, 0.3);
            border-radius: 16px;
            background-color: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(15px);
            text-align: center;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
        }
        .verification-title {
            font-size: 28px;
            margin-bottom: 20px;
            color: #ffffff;
            font-weight: 700;
        }
        .verification-desc {
            font-size: 16px;
            margin-bottom: 30px;
            color: #e0e0e0;
            line-height: 1.6;
        }
        /* 滑动验证容器 */
        #captcha-container {
            width: 100%;
            margin: 0 auto;
        }
        /* 背景图容器 */
        #captcha-background {
            width: 100%;
            height: 200px;
            background-color: #f5f5f5;
            border-radius: 12px;
            position: relative;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }
        /* 背景图 */
        #captcha-image {
            width: 100%;
            height: 100%;
            background-image: linear-gradient(45deg, #ff9a9e 0%, #fecfef 50%, #fecfef 100%);
            position: relative;
        }
        /* 缺口 */
        #captcha-gap {
            width: 60px;
            height: 60px;
            position: absolute;
            background-color: transparent;
            border: 2px dashed #ff4d4f;
            border-radius: 8px;
            box-sizing: border-box;
        }
        /* 滑块容器 */
        #slider-container {
            width: 100%;
            height: 60px;
            margin-top: 25px;
            position: relative;
        }
        /* 滑块轨道 */
        #slider-track {
            width: 100%;
            height: 60px;
            background-color: #f0f0f0;
            border-radius: 30px;
            position: relative;
            box-shadow: inset 0 2px 8px rgba(0, 0, 0, 0.1);
        }
        /* 滑块 */
        #slider {
            width: 60px;
            height: 60px;
            background: linear-gradient(135deg, #ffffff 0%, #f0f0f0 100%);
            border: 2px solid #d9d9d9;
            border-radius: 30px;
            position: absolute;
            top: 0;
            left: 0;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.15);
            display: flex;
            justify-content: center;
            align-items: center;
            transition: transform 0.1s ease, box-shadow 0.3s ease;
        }
        /* 滑块图标 */
        #slider::after {
            content: ">>";
            font-size: 24px;
            color: #1890ff;
            font-weight: bold;
        }
        /* 滑块按下状态 */
        #slider:active {
            transform: scale(1.1);
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.25);
        }
        /* 滑块提示文本 */
        #slider-text {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 18px;
            color: #666;
            user-select: none;
            font-weight: 500;
        }
        /* 验证结果提示 */
        #verification-result {
            margin-top: 25px;
            font-size: 16px;
            font-weight: 500;
        }

            #slider-track {

            }
            
            #slider {
                width: 50px;
                height: 50px;
                border-radius: 25px;
            }
            
            #slider::after {
                font-size: 20px;

            #slider-text {

            #verification-result {

            }
            
            #slider::after {

            }

            }
        }

</head>
