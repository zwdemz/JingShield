environment: prod
server:
  listen: "0.0.0.0:18080"
  read_timeout: 30
  write_timeout: 30
  max_body_bytes: 10485760
  trusted_proxies: []
  method_policies: []
upstream:
  target: "http://host.docker.internal:8080"
  timeout: 30
  pass_host: true
database:
  host: "host.docker.internal"
  port: 3306
  user: "jingshield"
  pass: ""
  name: "jyj_ccpro"
  charset: "utf8mb4"
  max_open_conns: 50
  max_idle_conns: 10
  conn_max_lifetime: 300
admin_ips:
  - "127.0.0.1"
  - "172.16.0.0/12"
  - "192.168.1.90"
log:
  level: "info"
  dir: "/var/lib/jingshield/logs"
data:
  qqwry_dat: "/var/lib/jingshield/data/QQWry.Dat"
  state_gc_interval: 60
session:
  name: "jingshield_session"
  secret: ""
  max_age: 7200
  secure: true
  verify_cookie_max_age: 3600
